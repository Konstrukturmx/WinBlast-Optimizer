[package]
name = "winblast-text"
version = "1.7.0"
edition = "2021"
description = "WinBlast0 text engine: hinted, pixel-aligned glyph rasterizer, contrast curve and atlas packer"
license = "MIT"
publish = false

[dependencies]
# Outlines and hinting (TrueType interpreter, CFF hinting and the FreeType-compatible autohinter).
# Same version Slint's text stack already uses, so no second copy is compiled.
skrifa = "0.44"
