[[tweaks]]
id = "disable_ceip"
title = "Disable Customer Experience Improvement Program (CEIP)"
category = "Telemetry (OS)"
description = "Disables CEIP scheduled tasks (Consolidator, UsbCeip, KernelCeipTask) and the CEIP policy registry key."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 1
privacy_gain = 4
reversibility = "Instant"
broken_features = ["CEIP telemetry data will not be collected"]

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\Microsoft\\Windows\\Customer Experience Improvement Program\\Consolidator"
enable = false

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\Microsoft\\Windows\\Customer Experience Improvement Program\\UsbCeip"
enable = false

[[tweaks.actions]]
