[[tweaks]]
id = "disable_telemetry_registry"
title = "Disable Telemetry via AllowTelemetry Registry"
category = "Telemetry (OS)"
description = "Sets the AllowTelemetry policy to 0 (Security/Off), the lowest telemetry level. On Enterprise and Education editions this fully disables telemetry; on Home and Pro it reduces it to the minimum required level."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 1
privacy_gain = 5
reversibility = "Instant"
broken_features = ["Some Windows Insider and diagnostic features may not work"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "AllowTelemetry"
optimized_value = 0
default_value = 3

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\DataCollection"
name = "AllowTelemetry"
optimized_value = 0
default_value = 3

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_compat_telrunner"
title = "Disable Application Compatibility Appraiser Tasks"
category = "Telemetry (OS)"
description = "Disables the Microsoft Compatibility Appraiser and ProgramDataUpdater scheduled tasks that run CompatTelRunner.exe, which scans installed software and sends compatibility telemetry."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 3
privacy_gain = 4
reversibility = "Instant"
broken_features = ["Windows upgrade compatibility checks will not run automatically"]

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\Microsoft\\Windows\\Application Experience\\Microsoft Compatibility Appraiser"
enable = false

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\Microsoft\\Windows\\Application Experience\\ProgramDataUpdater"
enable = false

