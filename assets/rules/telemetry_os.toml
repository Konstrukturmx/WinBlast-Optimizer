[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Diagnostics\\DiagTrack\\EventTranscriptKey"
name = "EnableEventTranscript"
optimized_value = 0
default_value = 1

