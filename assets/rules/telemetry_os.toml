[[tweaks]]
id = "disable_diagnostic_data_viewer"
title = "Disable Diagnostic Data Viewer"
category = "Telemetry (OS)"
description = "Disables the Diagnostic Data Viewer event logging, which stores a local copy of diagnostic data sent to Microsoft. Frees disk I/O and storage."
