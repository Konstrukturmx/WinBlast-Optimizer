# =============================================================================
# WinBlast0 — Windows OS Telemetry Tweaks
# =============================================================================

[[tweaks]]
id = "disable_diagtrack"
title = "Disable DiagTrack (Connected User Experiences and Telemetry)"
category = "Telemetry (OS)"
description = "Disables the Connected User Experiences and Telemetry service (DiagTrack / diagsvc), which is the primary Windows telemetry collection service."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 2
privacy_gain = 5
reversibility = "Instant"
broken_features = ["Diagnostic data will not be sent to Microsoft"]

[[tweaks.actions]]
type = "ServiceState"
service_name = "DiagTrack"
target_start_type = 4
default_start_type = 2

