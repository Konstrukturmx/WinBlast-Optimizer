[[tweaks]]
id = "disable_razer_telemetry"
title = "Disable Razer Telemetry and Analytics"
category = "Telemetry (Apps)"
description = "Disables the Razer Game Manager Service and Razer Chroma SDK services from auto-starting, reducing background telemetry and analytics from Razer Synapse."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 1
privacy_gain = 3
reversibility = "Instant"
broken_features = ["Razer Synapse auto-start features may require manual launch"]

[[tweaks.actions]]
type = "ServiceState"
service_name = "Razer Game Manager Service"
target_start_type = 4
default_start_type = 2

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\WOW6432Node\\Razer\\Synapse3\\Analytics"
name = "Enabled"
optimized_value = 0
default_value = 1
