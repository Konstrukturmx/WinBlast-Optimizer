# =============================================================================
# WinBlast0 — Third-Party Application Telemetry Tweaks
# =============================================================================

[[tweaks]]
id = "disable_nvidia_telemetry_service"
title = "Disable NVIDIA Telemetry Container Service"
category = "Telemetry (Apps)"
description = "Disables the NvTelemetryContainer service, which collects and transmits NVIDIA driver usage statistics and crash data."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 1
privacy_gain = 4
reversibility = "Instant"
broken_features = ["NVIDIA crash data and usage telemetry will not be collected"]

[[tweaks.actions]]
type = "ServiceState"
service_name = "NvTelemetryContainer"
target_start_type = 4
default_start_type = 2

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_nvidia_telemetry_tasks"
title = "Disable NVIDIA Telemetry Scheduled Tasks"
category = "Telemetry (Apps)"
description = "Disables the NvTmMon, NvTmRep, and NvProfile scheduled tasks that periodically report NVIDIA telemetry data."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 1
privacy_gain = 3
reversibility = "Instant"
broken_features = []

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\NvTmMon_{B2FE1952-0186-46C3-BAEC-A80AA35AC5B8}"
enable = false

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\NvTmRep_{B2FE1952-0186-46C3-BAEC-A80AA35AC5B8}"
enable = false

[[tweaks.actions]]
type = "ScheduledTask"
task_path = "\\NvProfileUpdaterDaily_{B2FE1952-0186-46C3-BAEC-A80AA35AC5B8}"
enable = false

