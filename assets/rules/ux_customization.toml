easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 1
privacy_gain = 1
reversibility = "Instant"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKCU"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer"
name = "HideSCAMeetNow"
optimized_value = 1
default_value = 0

