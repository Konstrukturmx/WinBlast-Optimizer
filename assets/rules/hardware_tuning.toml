reversibility = "Instant"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKCU"
path = "Software\\Microsoft\\GameBar"
name = "AutoGameModeEnabled"
optimized_value = 1
default_value = 0

[[tweaks.actions]]
type = "RegistryDword"
