# =============================================================================
# WinBlast0 — Hardware Tuning Tweaks
# =============================================================================

[[tweaks]]
id = "enable_hags"
title = "Enable Hardware Accelerated GPU Scheduling (HAGS)"
category = "Hardware Tuning"
description = "Enables Hardware Accelerated GPU Scheduling, allowing the GPU to manage its own VRAM scheduling directly. Reduces latency and CPU overhead for GPU-bound workloads. Requires a compatible GPU (NVIDIA GTX 1000+, AMD RX 5000+) and driver support."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 3
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = ["Some older games or GPU tools may exhibit instability"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers"
name = "HwSchMode"
optimized_value = 2
default_value = 1

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_mpo"
title = "Disable Multi-Plane Overlay (MPO)"
category = "Hardware Tuning"
description = "Disables the Multi-Plane Overlay hardware compositor feature. MPO is known to cause stuttering, black screens, and frame pacing issues on many GPU/driver combinations, especially with mixed-refresh-rate multi-monitor setups."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
max_build = 25999
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 3
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = ["Slightly higher GPU compositor power usage on laptops"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Microsoft\\Windows\\Dwm"
name = "OverlayTestMode"
optimized_value = 5
default_value = 0

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_core_parking"
title = "Disable CPU Core Parking"
category = "Hardware Tuning"
description = "Sets the minimum percentage of processor cores that must remain unparked to 100%, ensuring all cores are always available for workloads. Eliminates core wake-up latency at the cost of higher idle power."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 3
privacy_gain = 0
reversibility = "Instant"
broken_features = ["Higher idle power consumption", "Reduced battery life on laptops"]

[[tweaks.actions]]
type = "PowerCfgSetting"
subgroup_guid = "54533251-82be-4824-96c1-47b60b740d00"
setting_guid = "0cc5b647-c1df-4637-891a-dec35c318583"
optimized_ac = 100
optimized_dc = 100
default_ac = 10
default_dc = 5
scope = "AcAndDc"
unhide_attribute = true

[[tweaks.actions]]
type = "PowerCfgSetting"
subgroup_guid = "54533251-82be-4824-96c1-47b60b740d00"
setting_guid = "0cc5b647-c1df-4637-891a-dec35c318584"
optimized_ac = 100
optimized_dc = 100
default_ac = 10
default_dc = 5
scope = "AcAndDc"
unhide_attribute = true

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_cstates"
title = "Disable CPU Idle C-States"
category = "Hardware Tuning"
description = "Prevents the processor from entering deep idle C-states (C6/C7/C8) by setting the idle state policy to performance mode. Reduces latency spikes when the CPU transitions between power states, at the cost of idle power draw."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Moderate"
performance_gain = 3
privacy_gain = 0
reversibility = "Instant"
broken_features = ["Significantly higher idle power consumption", "Reduced battery life on laptops", "Higher CPU temperatures at idle"]

[[tweaks.actions]]
type = "PowerCfgSetting"
subgroup_guid = "54533251-82be-4824-96c1-47b60b740d00"
setting_guid = "5d76a2ca-e8c0-402f-a133-2158492d58ad"
optimized_ac = 1
optimized_dc = 1
default_ac = 0
default_dc = 0
scope = "AcOnly"
unhide_attribute = true

# -----------------------------------------------------------------------------

[[tweaks]]
id = "gpu_shader_cache_size"
title = "Extend GPU TDR Timeout & Prevent Driver Resets"
category = "Hardware Tuning"
description = "Increases the WDDM Timeout Detection and Recovery (TdrDelay) interval from 2s to 10s, preventing false GPU driver resets and stutters during heavy DirectX shader compilation."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 2
privacy_gain = 0
reversibility = "Instant"
broken_features = ["Display driver recovery waits up to 10s if a GPU hang genuinely occurs"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers"
name = "TdrDelay"
optimized_value = 10
default_value = 2

# -----------------------------------------------------------------------------

[[tweaks]]
id = "enable_game_mode"
title = "Enable Windows Game Mode"
category = "Hardware Tuning"
description = "Ensures Windows Game Mode is enabled (AutoGameModeEnabled=1, AllowAutoGameMode=1), useful if previously disabled or stripped, prioritizing gaming processes and suppressing Windows Update and restart notifications during gameplay."
easy_mode_included = true

