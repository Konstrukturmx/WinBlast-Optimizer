[[tweaks]]
id = "enable_long_file_paths"
title = "Enable NTFS Win32 Long File Paths (>260 Characters)"
category = "OS Settings"
description = "Removes the legacy 260-character MAX_PATH limitation in Windows 10/11 via LongPathsEnabled=1, preventing build and archive extraction path truncation errors."
easy_mode_included = true
unattend_safe = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 1
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\FileSystem"
name = "LongPathsEnabled"
optimized_value = 1
default_value = 0

