[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "High"
performance_gain = 2
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = ["Cold launch speed may slow slightly on SATA HDDs"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management\\PrefetchParameters"
name = "EnablePrefetcher"
optimized_value = 0
default_value = 3

[[tweaks.actions]]
type = "ServiceState"
service_name = "SysMain"
target_start_type = 4
default_start_type = 2
