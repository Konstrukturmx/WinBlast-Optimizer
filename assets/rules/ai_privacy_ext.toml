unattend_safe = true

[tweaks.os_req]
min_build = 26100
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 3
privacy_gain = 5
reversibility = "Instant"
