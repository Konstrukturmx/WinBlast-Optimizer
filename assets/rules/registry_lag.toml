# =============================================================================
# WinBlast0 — Registry Lag, Input & Scheduling Tweaks
# =============================================================================

[[tweaks]]
id = "win32_priority_separation"
title = "Win32PrioritySeparation — Foreground Boost"
category = "Registry Lag"
description = "Sets the scheduler quantum to short, variable, with high foreground boost (0x26 = 38). This prioritizes foreground applications for lower input latency in games and interactive workloads."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 4
privacy_gain = 0
reversibility = "Instant"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\PriorityControl"
name = "Win32PrioritySeparation"
optimized_value = 38
default_value = 2

