# =============================================================================
# WinBlast0 — Privacy Settings Tweaks
# =============================================================================

[[tweaks]]
id = "disable_advertising_id"
title = "Disable Advertising ID"
category = "Privacy"
description = "Disables the per-user advertising ID that Windows provides to apps for targeted advertising and cross-app tracking."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 0
privacy_gain = 5
reversibility = "Instant"
broken_features = ["Apps will not receive a unique advertising ID"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKCU"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo"
name = "Enabled"
optimized_value = 0
default_value = 1

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo"
name = "DisabledByGroupPolicy"
optimized_value = 1
default_value = 0

# -----------------------------------------------------------------------------

[[tweaks]]
id = "disable_cortana"
title = "Disable Cortana"
category = "Privacy"
description = "Disables Cortana via Group Policy, preventing it from running, listening, and sending data to Microsoft cloud services."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
max_build = 21999
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 2
privacy_gain = 5
reversibility = "Instant"
broken_features = ["Cortana voice assistant will be disabled"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search"
name = "AllowCortana"
optimized_value = 0
default_value = 1

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search"
name = "AllowCortanaAboveLock"
optimized_value = 0
default_value = 1

