[[tweaks]]
id = "disable_page_file_encryption"
title = "Disable Page File Encryption & Clear-on-Shutdown"
category = "Kernel & Memory Optimization"
description = "Prevents Windows from encrypting the page file contents and disables clearing the page file at shutdown. Page file encryption imposes CPU overhead on every page-out operation, and clearing adds seconds to shutdown time. Disabling both improves paging throughput and shutdown speed, but leaves paged-out memory readable on the raw disk."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "High"
