title = "Disable Memory Compression Engine"
category = "Kernel & Memory Optimization"
description = "Disables the Windows Memory Manager compression store by setting DisableCompression=1. Windows 10+ compresses infrequently-used memory pages instead of paging them out; this saves disk IO but adds CPU overhead. On systems with 16 GB+ RAM, disabling compression reduces CPU usage spikes from the System process memory compression thread."
