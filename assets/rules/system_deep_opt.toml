[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
name = "ClearPageFileAtShutdown"
optimized_value = 0
default_value = 1

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
name = "DisablePagingEncryption"
optimized_value = 1
default_value = 0

