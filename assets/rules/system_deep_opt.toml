privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\FileSystem"
name = "NtfsMemoryUsage"
optimized_value = 2
default_value = 1

