[[tweaks]]
id = "disable_spectre_meltdown_mitigations"
title = "Disable Spectre/Meltdown CPU Vulnerability Mitigations"
category = "Kernel & Memory Optimization"
description = "Disables hardware-level Spectre and Meltdown CPU vulnerability mitigations by setting FeatureSettingsOverride=3 and FeatureSettingsOverrideMask=3. This removes the performance penalty imposed by speculative execution side-channel attack mitigations, yielding significant CPU throughput gains in compute-heavy workloads at the cost of leaving the system vulnerable to these hardware-level exploits."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Extreme"
performance_gain = 5
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = ["System is vulnerable to Spectre and Meltdown CPU side-channel attacks"]

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
name = "FeatureSettingsOverride"
optimized_value = 3
default_value = 0

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
name = "FeatureSettingsOverrideMask"
optimized_value = 3
default_value = 0

