[[tweaks]]
id = "disable_threaded_dpc_optimization"
title = "Disable Threaded DPC for Lower Interrupt Latency"
category = "Scheduler & Latency"
description = "Sets ThreadDpcEnable=0 in the Session Manager kernel key, forcing Deferred Procedure Calls to execute at DISPATCH_LEVEL instead of in a dedicated thread at PASSIVE_LEVEL. Threaded DPCs add scheduling overhead; disabling them reduces DPC latency at the cost of potentially blocking other PASSIVE_LEVEL work. Ideal for real-time audio production and competitive gaming where sub-millisecond interrupt handling is critical."
easy_mode_included = false

