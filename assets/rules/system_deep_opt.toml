[[tweaks]]
id = "increase_irp_stack_size"
title = "Increase IRP Stack Size for Network/Disk IO"
category = "Kernel & Memory Optimization"
description = "Raises the I/O Request Packet stack size from the default 15 to 32 entries, giving the SMB server and layered filter drivers more stack frames for complex IO operations. Helps avoid STATUS_INSUFFICIENT_RESOURCES errors and improves throughput on systems running antivirus, backup agents, or deep storage filter stacks."
easy_mode_included = false

