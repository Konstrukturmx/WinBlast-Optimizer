[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters"
name = "IRPStackSize"
optimized_value = 32
default_value = 15

