[[tweaks]]
id = "disable_rss_base_cpu"
title = "Set RSS Base CPU for Network Load Distribution"
category = "Network Stack Optimization"
description = "Sets RssBaseCpu=1 in the NDIS parameters, directing Receive Side Scaling to start distributing network interrupt processing from CPU 1 instead of CPU 0. This offloads network interrupt processing from the boot CPU, freeing CPU 0 for foreground application threads and reducing gaming micro-stutters caused by NIC interrupt contention."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Low"
performance_gain = 2
privacy_gain = 0
reversibility = "RequiresReboot"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKLM"
path = "SYSTEM\\CurrentControlSet\\Services\\Ndis\\Parameters"
name = "RssBaseCpu"
optimized_value = 1
default_value = 0

# -----------------------------------------------------------------------------

[[tweaks]]
id = "enable_hardware_task_offload"
title = "Enable TCP/IP Hardware Task Offloading"
category = "Network Stack Optimization"
description = "Sets DisableTaskOffload=0 in the TCP/IP parameters, ensuring the OS offloads checksum calculation, TCP segmentation, and large send operations to the NIC hardware. Modern NICs handle these operations faster than the CPU, reducing network processing overhead and freeing CPU cycles for application workloads."
easy_mode_included = false

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
