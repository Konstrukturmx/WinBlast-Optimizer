[[tweaks]]
id = "optimize_ntfs_memory_usage"
title = "Aggressive NTFS Paged-Pool Caching"
category = "Kernel & Memory Optimization"
description = "Sets NtfsMemoryUsage to 2, instructing the NTFS driver to use a larger paged-pool allocation for directory and metadata caching. This reduces repeated disk reads on volumes with many small files, improving file enumeration and build system performance on systems with ample RAM."
