category = "GPU & Display Pipeline"
description = "Sets GpuPreemptionLevel=0 in the Graphics Drivers Scheduler, forcing compute-only GPU preemption. This prevents the GPU scheduler from preempting long-running shader workloads mid-execution, reducing GPU context-switch overhead and micro-stutters in graphically intensive games at the cost of potentially longer GPU hangs if a shader stalls."
