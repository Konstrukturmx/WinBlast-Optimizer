[[tweaks]]
id = "disable_animations"
title = "Disable Window Animations"
category = "OS Settings"
description = "Disables the animate-windows-when-minimizing-and-maximizing visual effect, reducing perceived UI lag."
easy_mode_included = true

[tweaks.os_req]
min_build = 19041
editions = ["Home", "Pro", "Enterprise", "Education"]

[tweaks.valuation]
stability_risk = "Safe"
performance_gain = 2
privacy_gain = 0
reversibility = "Instant"
broken_features = []

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKCU"
path = "Control Panel\\Desktop\\WindowMetrics"
name = "MinAnimate"
optimized_value = 0
default_value = 1

[[tweaks.actions]]
type = "RegistryDword"
hive = "HKCU"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
name = "TaskbarAnimations"
optimized_value = 0
default_value = 1

