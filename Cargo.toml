[package]
name = "winblast0"
version = "1.6.1"
edition = "2021"
description = "WinBlast0 – Windows System Optimizer & Debloater"

[features]
default = ["ui-rune"]
ui-rune = ["dep:rune", "dep:rune-kit", "dep:rune-motion"]
ui-slint = ["dep:slint", "dep:slint-build"]
live-preview = ["slint/live-preview"]

[dependencies]
# GUI – Rune native GPU-rendered framework & Rune Kit
rune = { path = "C:/Hive/rune-framework/crates/rune", optional = true }
rune-kit = { path = "C:/Hive/rune-framework/crates/rune-kit", optional = true }
rune-motion = { path = "C:/Hive/rune-framework/crates/rune-motion", optional = true }
crossbeam-channel = "0.5"

# Slint 1.19.0 Declarative GUI Toolkit
slint = { version = "1.19.0", optional = true, default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "accessibility",
    "system-tray",
    "image-default-formats",
    "compat-1-2",
] }

# Official Microsoft Win32 Rust bindings (matching rune's 0.62 version)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Wmi",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

# Registry access
winreg = "0.52"

# Hardware detection
raw-cpuid = "11"
sysinfo = "0.32"

# Embedded SQLite for state ledger
rusqlite = { version = "0.32", features = ["bundled"] }

# Cryptography for preset verification & signing
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
rayon = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1.6"
i-slint-backend-testing = "1.19.0"

[build-dependencies]
embed-manifest = "1.4"
winres = "0.1"
slint-build = { version = "1.19.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
parley_engine = { path = "C:/Hive/rune-framework/vendor/parley_engine" }
wgpu-hal = { path = "C:/Hive/rune-framework/vendor/wgpu-hal" }
winit = { path = "C:/Hive/rune-framework/vendor/winit" }
accesskit_windows = { path = "C:/Hive/rune-framework/vendor/accesskit_windows" }

