[package]
name = "winblast0"
version = "1.5.0"
edition = "2021"
description = "WinBlast0 – Windows System Optimizer & Debloater"

[dependencies]
# GUI – Rune native GPU-rendered framework & Rune Kit
rune = { path = "C:/Hive/rune-framework/crates/rune" }
rune-kit = { path = "C:/Hive/rune-framework/crates/rune-kit" }
rune-motion = { path = "C:/Hive/rune-framework/crates/rune-motion" }
crossbeam-channel = "0.5"

# Official Microsoft Win32 Rust bindings (matching rune's 0.62 version)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Wmi",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

# Registry access
winreg = "0.52"

# Hardware detection
raw-cpuid = "11"
sysinfo = "0.32"

# Embedded SQLite for state ledger
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
embed-manifest = "1.4"
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

