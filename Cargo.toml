[package]
name = "winblast0"
version = "1.7.1"
edition = "2021"
description = "WinBlast0 – Windows System Optimizer & Debloater"

[features]
default = []
live-preview = ["slint/live-preview"]
# Enables tests that read/write the real Windows host (registry, filesystem, live probes).
# Only ever enabled inside the disposable Hyper-V test VM — never on a developer machine.
vm-tests = []
# Development only: load tweak rules from assets/rules on disk instead of the embedded catalog.
# Never enable for a release; the elevated app must not read rules from user-writable folders.
dev-rules = []

[dependencies]
crossbeam-channel = "0.5"

# WinBlast0 text engine (hinted, pixel-aligned glyphs); also used by the patched Slint renderer.
winblast-text = { path = "crates/winblast-text" }

# Slint 1.19.0 Declarative GUI Toolkit
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "accessibility",
    "system-tray",
    "image-default-formats",
    "compat-1-2",
] }

# Official Microsoft Win32 Rust bindings
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Wmi",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

# Registry access
winreg = "0.52"

# Hardware detection
raw-cpuid = "11"
sysinfo = "0.32"

# Embedded SQLite for state ledger
rusqlite = { version = "0.32", features = ["bundled"] }

# Cryptography for preset verification & signing
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
rayon = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1.6"
i-slint-backend-testing = "1.19.0"
ttf-parser = "0.25"

[build-dependencies]
embed-manifest = "1.4"
winres = "0.1"
slint-build = "1.19.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = [".", "crates/winblast-text"]
exclude = ["vendor"]

# Slint's GPU renderer with the winblast-text glyph path (see vendor/README.md).
[patch.crates-io]
i-slint-renderer-femtovg = { path = "vendor/i-slint-renderer-femtovg" }
